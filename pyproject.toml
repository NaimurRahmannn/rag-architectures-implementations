[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "rag-architectures-implementations"
version = "0.1.0"
description = "Separate applications for learning advanced RAG architectures"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "langchain>=1.1,<2.0",
    "langchain-google-genai>=4.0,<5.0",
    "langchain-qdrant>=1.0,<2.0",
    "langchain-text-splitters>=1.0,<2.0",
    "qdrant-client>=1.15,<2.0",
    "pydantic-settings>=2.10,<3.0",
    "python-dotenv>=1.0,<2.0",
]


[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<10.0",
    "pytest-cov>=6.2,<8.0",
    "ruff>=0.12,<1.0",
]


[tool.setuptools.packages.find]
include = ["apps*"]


[tool.pytest.ini_options]
testpaths = ["apps/baseline_rag/tests"]
pythonpath = ["."]
addopts = "-q"


[tool.ruff]
target-version = "py311"
line-length = 88


[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]